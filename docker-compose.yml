services:
  postgres:
    image: postgres:15-alpine
    container_name: uoa_helpdesk_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-uoa_helpdesk_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - helpdesk-net

  helpdesk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uoa_helpdesk_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-uoa_helpdesk_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - helpdesk-net

volumes:
  pgdata:

networks:
  helpdesk-net:
    driver: bridge
