services:
  # 2. IT Ticketing Web App (Node + Express + React Vite)
  helpdesk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uoa_helpdesk_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    env_file:
      - .env
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge
